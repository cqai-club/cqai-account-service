name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND || 'systemctl restart cqai-account-service' }}
      LOGTO_ISSUER: ${{ vars.LOGTO_ISSUER }}
      LOGTO_AUDIENCE: ${{ vars.LOGTO_AUDIENCE }}
      LOGTO_ADMIN_CLIENT_ID: ${{ vars.LOGTO_ADMIN_CLIENT_ID }}
      LOGTO_ADMIN_REDIRECT_URI: ${{ vars.LOGTO_ADMIN_REDIRECT_URI }}
      NEW_API_BASE_URL: ${{ vars.NEW_API_BASE_URL }}

    steps:
      - name: Validate deployment settings
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$LOGTO_ISSUER"
          test -n "$LOGTO_AUDIENCE"
          test -n "$LOGTO_ADMIN_CLIENT_ID"
          test -n "$LOGTO_ADMIN_REDIRECT_URI"

      - name: Checkout account service
        uses: actions/checkout@v4
        with:
          path: cqai-account-service

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/cqai-account-service'"

      - name: Sync source
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.actions' \
            --exclude 'dist/' \
            --exclude '*/dist/' \
            --exclude '.tsbuildinfo' \
            ./cqai-account-service/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/cqai-account-service/"

      - name: Sync public runtime configuration
        run: |
          for name in LOGTO_ISSUER LOGTO_AUDIENCE LOGTO_ADMIN_CLIENT_ID LOGTO_ADMIN_REDIRECT_URI NEW_API_BASE_URL; do
            value="${!name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must be a single-line value" >&2
              exit 1
            fi
          done

          {
            printf 'LOGTO_ISSUER=%s\n' "$LOGTO_ISSUER"
            printf 'LOGTO_AUDIENCE=%s\n' "$LOGTO_AUDIENCE"
            printf 'LOGTO_ADMIN_CLIENT_ID=%s\n' "$LOGTO_ADMIN_CLIENT_ID"
            printf 'LOGTO_ADMIN_REDIRECT_URI=%s\n' "$LOGTO_ADMIN_REDIRECT_URI"
            printf 'NEW_API_BASE_URL=%s\n' "$NEW_API_BASE_URL"
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -m 600 /dev/stdin '$DEPLOY_PATH/cqai-account-service/apps/server/.env.actions'"

      - name: Install, build, and restart
        run: |
          remote_command="cd '${DEPLOY_PATH}/cqai-account-service' && npm ci && npm run build && ${DEPLOY_COMMAND}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -lc "$(printf '%q' "$remote_command")"
