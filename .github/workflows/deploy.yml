name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND || 'systemctl restart cqai-account-service' }}
      NEW_API_INTERNAL_TOKEN: ${{ secrets.NEW_API_INTERNAL_TOKEN }}
      LOGTO_ISSUER: ${{ vars.LOGTO_ISSUER }}
      LOGTO_AUDIENCE: ${{ vars.LOGTO_AUDIENCE }}
      NEW_API_BASE_URL: ${{ vars.NEW_API_BASE_URL }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      CLIENT_DEFAULT_MODEL: ${{ vars.CLIENT_DEFAULT_MODEL }}
      LOGTO_CLIENT_PLATFORM_MAP: ${{ vars.LOGTO_CLIENT_PLATFORM_MAP }}
      LOGTO_REQUIRED_SCOPES: ${{ vars.LOGTO_REQUIRED_SCOPES || 'ai:invoke' }}
      LOGTO_ADMIN_SCOPE: ${{ vars.LOGTO_ADMIN_SCOPE || 'account:admin' }}
      LOGTO_ROOT_SCOPE: ${{ vars.LOGTO_ROOT_SCOPE || 'account:root' }}
      ACCOUNT_CACHE_TTL_SECONDS: ${{ vars.ACCOUNT_CACHE_TTL_SECONDS || '300' }}
      MAX_REQUEST_BODY_BYTES: ${{ vars.MAX_REQUEST_BODY_BYTES || '20971520' }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

    steps:
      - name: Validate deployment settings
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$LOGTO_ISSUER"
          test -n "$LOGTO_AUDIENCE"
          test -n "$CORS_ALLOWED_ORIGINS"
          test -n "$LOGTO_CLIENT_PLATFORM_MAP"
          test -n "$LOGTO_REQUIRED_SCOPES"
          test -n "$LOGTO_ADMIN_SCOPE"
          test -n "$LOGTO_ROOT_SCOPE"
          test -n "$ACCOUNT_CACHE_TTL_SECONDS"
          test -n "$MAX_REQUEST_BODY_BYTES"
          test -n "$NEW_API_INTERNAL_TOKEN"

      - name: Checkout account service
        uses: actions/checkout@v4
        with:
          path: cqai-account-service

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/cqai-account-service'"

      - name: Sync source
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.actions' \
            --exclude 'dist/' \
            --exclude '*/dist/' \
            --exclude '.tsbuildinfo' \
            ./cqai-account-service/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/cqai-account-service/"

      - name: Sync runtime configuration
        run: |
          for name in LOGTO_ISSUER LOGTO_AUDIENCE NEW_API_BASE_URL CORS_ALLOWED_ORIGINS CLIENT_DEFAULT_MODEL LOGTO_CLIENT_PLATFORM_MAP LOGTO_REQUIRED_SCOPES LOGTO_ADMIN_SCOPE LOGTO_ROOT_SCOPE ACCOUNT_CACHE_TTL_SECONDS MAX_REQUEST_BODY_BYTES NEW_API_INTERNAL_TOKEN; do
            value="${!name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must be a single-line value" >&2
              exit 1
            fi
          done

          {
            printf 'LOGTO_ISSUER=%s\n' "$LOGTO_ISSUER"
            printf 'LOGTO_AUDIENCE=%s\n' "$LOGTO_AUDIENCE"
            printf 'NEW_API_BASE_URL=%s\n' "$NEW_API_BASE_URL"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
            if [[ -n "$CLIENT_DEFAULT_MODEL" ]]; then
              printf 'CLIENT_DEFAULT_MODEL=%s\n' "$CLIENT_DEFAULT_MODEL"
            fi
            printf 'LOGTO_CLIENT_PLATFORM_MAP=%s\n' "$LOGTO_CLIENT_PLATFORM_MAP"
            printf 'LOGTO_REQUIRED_SCOPES=%s\n' "$LOGTO_REQUIRED_SCOPES"
            printf 'LOGTO_ADMIN_SCOPE=%s\n' "$LOGTO_ADMIN_SCOPE"
            printf 'LOGTO_ROOT_SCOPE=%s\n' "$LOGTO_ROOT_SCOPE"
            printf 'ACCOUNT_CACHE_TTL_SECONDS=%s\n' "$ACCOUNT_CACHE_TTL_SECONDS"
            printf 'MAX_REQUEST_BODY_BYTES=%s\n' "$MAX_REQUEST_BODY_BYTES"
            printf 'NEW_API_INTERNAL_TOKEN=%s\n' "$NEW_API_INTERNAL_TOKEN"
            if [[ -n "$REDIS_URL" ]]; then
              printf 'REDIS_URL=%s\n' "$REDIS_URL"
            fi
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -m 600 /dev/stdin '$DEPLOY_PATH/cqai-account-service/apps/server/.env.actions'"

      - name: Install, build, and restart
        run: |
          remote_command="cd '${DEPLOY_PATH}/cqai-account-service' && npm ci && npm run build && ${DEPLOY_COMMAND}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -lc "$(printf '%q' "$remote_command")"
