name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/cqai-club/cqai-account-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout account service
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      NEW_API_INTERNAL_TOKEN: ${{ secrets.NEW_API_INTERNAL_TOKEN }}
      LOGTO_ISSUER: ${{ vars.LOGTO_ISSUER }}
      LOGTO_AUDIENCE: ${{ vars.LOGTO_AUDIENCE }}
      NEW_API_BASE_URL: ${{ vars.NEW_API_BASE_URL }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      CLIENT_DEFAULT_MODEL: ${{ vars.CLIENT_DEFAULT_MODEL }}
      LOGTO_CLIENT_PLATFORM_MAP: ${{ vars.LOGTO_CLIENT_PLATFORM_MAP }}
      LOGTO_REQUIRED_SCOPES: ${{ vars.LOGTO_REQUIRED_SCOPES || 'ai:invoke' }}
      LOGTO_ADMIN_SCOPE: ${{ vars.LOGTO_ADMIN_SCOPE || 'account:admin' }}
      LOGTO_ROOT_SCOPE: ${{ vars.LOGTO_ROOT_SCOPE || 'account:root' }}
      ACCOUNT_CACHE_TTL_SECONDS: ${{ vars.ACCOUNT_CACHE_TTL_SECONDS || '300' }}
      MAX_REQUEST_BODY_BYTES: ${{ vars.MAX_REQUEST_BODY_BYTES || '20971520' }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      IMAGE_TAG: ${{ github.sha }}
      CONTAINER_NAME: cqai-account-service
      LEGACY_SERVICE_NAME: ${{ vars.LEGACY_SERVICE_NAME || 'cqai-account-service' }}
      ACCOUNT_SERVICE_PORT: ${{ vars.ACCOUNT_SERVICE_PORT || '8787' }}

    steps:
      - name: Validate deployment settings
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          test -n "$LOGTO_ISSUER"
          test -n "$LOGTO_AUDIENCE"
          test -n "$CORS_ALLOWED_ORIGINS"
          test -n "$LOGTO_CLIENT_PLATFORM_MAP"
          test -n "$LOGTO_REQUIRED_SCOPES"
          test -n "$LOGTO_ADMIN_SCOPE"
          test -n "$LOGTO_ROOT_SCOPE"
          test -n "$ACCOUNT_CACHE_TTL_SECONDS"
          test -n "$MAX_REQUEST_BODY_BYTES"
          test -n "$NEW_API_INTERNAL_TOKEN"
          [[ "$ACCOUNT_SERVICE_PORT" =~ ^[0-9]+$ ]]

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/cqai-account-service/apps/server'"

      - name: Sync runtime configuration
        run: |
          for name in LOGTO_ISSUER LOGTO_AUDIENCE NEW_API_BASE_URL CORS_ALLOWED_ORIGINS CLIENT_DEFAULT_MODEL LOGTO_CLIENT_PLATFORM_MAP LOGTO_REQUIRED_SCOPES LOGTO_ADMIN_SCOPE LOGTO_ROOT_SCOPE ACCOUNT_CACHE_TTL_SECONDS MAX_REQUEST_BODY_BYTES NEW_API_INTERNAL_TOKEN; do
            value="${!name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must be a single-line value" >&2
              exit 1
            fi
          done

          {
            printf 'LOGTO_ISSUER=%s\n' "$LOGTO_ISSUER"
            printf 'LOGTO_AUDIENCE=%s\n' "$LOGTO_AUDIENCE"
            printf 'NEW_API_BASE_URL=%s\n' "$NEW_API_BASE_URL"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
            if [[ -n "$CLIENT_DEFAULT_MODEL" ]]; then
              printf 'CLIENT_DEFAULT_MODEL=%s\n' "$CLIENT_DEFAULT_MODEL"
            fi
            printf 'LOGTO_CLIENT_PLATFORM_MAP=%s\n' "$LOGTO_CLIENT_PLATFORM_MAP"
            printf 'LOGTO_REQUIRED_SCOPES=%s\n' "$LOGTO_REQUIRED_SCOPES"
            printf 'LOGTO_ADMIN_SCOPE=%s\n' "$LOGTO_ADMIN_SCOPE"
            printf 'LOGTO_ROOT_SCOPE=%s\n' "$LOGTO_ROOT_SCOPE"
            printf 'ACCOUNT_CACHE_TTL_SECONDS=%s\n' "$ACCOUNT_CACHE_TTL_SECONDS"
            printf 'MAX_REQUEST_BODY_BYTES=%s\n' "$MAX_REQUEST_BODY_BYTES"
            printf 'NEW_API_INTERNAL_TOKEN=%s\n' "$NEW_API_INTERNAL_TOKEN"
            if [[ -n "$REDIS_URL" ]]; then
              printf 'REDIS_URL=%s\n' "$REDIS_URL"
            fi
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -m 600 /dev/stdin '$DEPLOY_PATH/cqai-account-service/apps/server/.env.actions'"

      - name: Log in to GHCR on deploy server
        run: |
          remote_ghcr_username="$(printf '%q' "$GHCR_USERNAME")"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username ${remote_ghcr_username} --password-stdin"

      - name: Pull and activate image
        run: |
          remote_deploy_path="$(printf '%q' "$DEPLOY_PATH")"
          remote_image_repository="$(printf '%q' "$IMAGE_REPOSITORY")"
          remote_image_tag="$(printf '%q' "$IMAGE_TAG")"
          remote_container_name="$(printf '%q' "$CONTAINER_NAME")"
          remote_legacy_service="$(printf '%q' "$LEGACY_SERVICE_NAME")"
          remote_service_port="$(printf '%q' "$ACCOUNT_SERVICE_PORT")"
          remote_command="DEPLOY_PATH=${remote_deploy_path} IMAGE_REPOSITORY=${remote_image_repository} IMAGE_TAG=${remote_image_tag} CONTAINER_NAME=${remote_container_name} LEGACY_SERVICE_NAME=${remote_legacy_service} ACCOUNT_SERVICE_PORT=${remote_service_port} bash -s"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          state_dir="${DEPLOY_PATH}/cqai-account-service"
          env_file="${state_dir}/apps/server/.env.actions"
          image_ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          current_ref="${IMAGE_REPOSITORY}:current"
          rollback_ref="${IMAGE_REPOSITORY}:rollback"

          test -f "$env_file"
          docker pull "$image_ref"

          wait_for_healthy() {
            for _ in $(seq 1 30); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_NAME" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  return 0
                  ;;
                unhealthy)
                  return 1
                  ;;
              esac
              sleep 2
            done
            return 1
          }

          run_current() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --network host \
              --env-file "$env_file" \
              --env "PORT=${ACCOUNT_SERVICE_PORT}" \
              "$current_ref" >/dev/null
          }

          restore_legacy_service() {
            systemctl enable --now "$LEGACY_SERVICE_NAME" >/dev/null 2>&1 || true
          }

          rollback() {
            if docker image inspect "$rollback_ref" >/dev/null 2>&1; then
              docker tag "$rollback_ref" "$current_ref"
              if run_current && wait_for_healthy; then
                echo "Rolled back to the previous Account Service image"
                return 0
              fi
            fi
            restore_legacy_service
            echo "No healthy rollback image is available" >&2
            return 1
          }

          if docker image inspect "$current_ref" >/dev/null 2>&1; then
            docker tag "$current_ref" "$rollback_ref"
          fi

          systemctl disable --now "$LEGACY_SERVICE_NAME" >/dev/null 2>&1 || true
          if ! docker tag "$image_ref" "$current_ref" || ! run_current || ! wait_for_healthy; then
            echo "New Account Service image failed its health check" >&2
            rollback
            exit 1
          fi

          while IFS= read -r tag; do
            case "$tag" in
              "$current_ref"|"$rollback_ref") ;;
              *) docker image rm "$tag" >/dev/null 2>&1 || true ;;
            esac
          done < <(docker image ls "$IMAGE_REPOSITORY" --format '{{.Repository}}:{{.Tag}}')

          echo "Account Service image is active; current and rollback tags are retained"
          REMOTE_SCRIPT

      - name: Log out of GHCR on deploy server
        if: always()
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"
